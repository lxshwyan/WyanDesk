<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>收藏到微言桌面</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><span class="mark">W</span><span><strong>收藏到微言桌面</strong><small>WyanDesk</small></span></header>
      <section class="destination">
        <label><span>桌面</span><select id="workspace"></select></label>
        <label><span>分类</span><select id="category"></select></label>
      </section>
      <section class="capture-box" aria-labelledby="capture-title">
        <div class="section-heading"><span><strong id="capture-title">当前网页</strong><small>只读取标题和网址</small></span></div>
        <div class="capture-kinds" role="group" aria-label="保存类型"><button class="active" data-capture-kind="link" type="button">网站</button><button data-capture-kind="task" type="button">任务</button><button data-capture-kind="note" type="button">便签</button></div>
        <button class="primary" id="savePage" type="button"><span>＋</span><span><strong id="save-page-label">收藏当前网页</strong><small id="save-page-note">加入当前桌面分类</small></span></button>
      </section>
      <div class="group-box">
        <label><span>会话名称</span><input id="groupTitle" maxlength="30" placeholder="例如：本周研究资料" /></label>
        <button class="secondary" id="saveWindow" type="button"><span>▦</span><span><strong>暂存当前窗口</strong><small>保留顺序与固定状态，同时创建网站组合</small></span></button>
        <div id="session-list" class="session-list"></div>
      </div>
      <section class="bookmark-box" aria-labelledby="bookmark-title">
        <div class="section-heading"><span><strong id="bookmark-title">浏览器书签迁移</strong><small>保留文件夹分类，不覆盖原内容</small></span><span class="permission-chip">按需授权</span></div>
        <div class="bookmark-actions">
          <button class="compact" id="importBookmarks" type="button"><span>↓</span><span><strong>导入浏览器书签</strong><small>加入当前桌面</small></span></button>
          <button class="compact" id="exportBookmarks" type="button"><span>↑</span><span><strong>导出当前桌面</strong><small>写入浏览器书签</small></span></button>
        </div>
      </section>
      <p id="status" role="status">收藏后会自动出现在下一个微言桌面标签页。</p>
      <footer>标签页与书签权限都只在点击对应功能时申请</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
