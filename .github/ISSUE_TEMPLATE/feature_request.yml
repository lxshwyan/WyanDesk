name: 功能建议
description: 建议更轻松、清晰或高效的使用方式
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请先描述使用场景，而不只是一个解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎样改进
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法
